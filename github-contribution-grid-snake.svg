<svg width="900" height="160"
xmlns="http://www.w3.org/2000/svg">

<style>

.commit{fill:#40c463;}
.commit2{fill:#30a14e;}
.commit3{fill:#216e39;}

@keyframes snakeMove{
  0%   {transform:translateX(0px);}
  100% {transform:translateX(760px);}
}

@keyframes tongue{
  0%,100%{height:4px;}
  50%{height:10px;}
}

.snake{
  animation:snakeMove 12s linear infinite;
}

</style>

<!-- commits -->

<rect x="20" y="40" width="14" height="14" rx="3" class="commit"/>
<rect x="40" y="40" width="14" height="14" rx="3" class="commit2"/>
<rect x="60" y="40" width="14" height="14" rx="3" class="commit3"/>
<rect x="80" y="40" width="14" height="14" rx="3" class="commit"/>

<rect x="100" y="40" width="14" height="14" rx="3" class="commit2"/>
<rect x="120" y="40" width="14" height="14" rx="3" class="commit3"/>
<rect x="140" y="40" width="14" height="14" rx="3" class="commit"/>

<!-- maçã -->

<circle cx="700" cy="47" r="7" fill="#ff1744"/>
<rect x="698" y="36" width="3" height="6" fill="#00c853"/>

<!-- cobra -->

<g class="snake">

<circle cx="70" cy="47" r="10" fill="#ff69b4"/>
<circle cx="55" cy="47" r="8" fill="#ff85c2"/>
<circle cx="42" cy="47" r="7" fill="#ff9bd0"/>
<circle cx="30" cy="47" r="6" fill="#ffb6de"/>

<!-- olhos -->

<circle cx="73" cy="44" r="1.5" fill="#fff"/>
<circle cx="73" cy="50" r="1.5" fill="#fff"/>

<!-- língua -->

<rect x="80"
      y="45"
      width="2"
      height="6"
      fill="#ff1744">

<animate attributeName="height"
         values="4;10;4"
         dur="0.25s"
         repeatCount="indefinite"/>

</rect>

</g>

</svg>
